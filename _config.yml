# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Amir Shargh"
title: "PhD Researcher"
institution: "PSU"
email: ""  # add your preferred contact email
photo: headshot.jpg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: ""
  github: "https://github.com/AGB-Shargh"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a4d8f"
dark_mode: true
description: "Academic webpage of Amir Shargh. Research interests include structural engineering, earthquake engineering, reliability analysis, optimization, and machine learning."
baseurl: ""
url: ""

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: research
  - name: software
  - name: teaching

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll-sitemap"]

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
